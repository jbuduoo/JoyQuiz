<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>詳解閱讀器</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #202124;
      --muted: #6b7280;
      --line: #d8dde6;
      --accent: #1f6feb;
      --accent-soft: #e9f2ff;
      --ok: #17803b;
      --bad: #b42318;
      --warn: #9a6700;
      --shadow: 0 8px 24px rgba(31, 41, 55, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      line-height: 1.65;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(246, 247, 249, 0.94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }

    .wrap {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }

    .top {
      display: grid;
      gap: 14px;
      padding: 18px 0;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .source-row,
    .controls {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 10px;
      align-items: center;
    }

    .controls {
      grid-template-columns: minmax(180px, 1.1fr) minmax(150px, 0.7fr) minmax(130px, 0.55fr) auto;
    }

    input,
    select,
    button {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font: inherit;
      letter-spacing: 0;
    }

    input[type="text"],
    select {
      width: 100%;
      padding: 8px 12px;
    }

    input[type="file"] {
      width: 100%;
      padding: 7px 10px;
    }

    button {
      padding: 8px 14px;
      cursor: pointer;
      font-weight: 700;
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    button[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: #0b4fb3;
    }

    main {
      padding: 22px 0 40px;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 14px;
    }

    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      padding: 4px 10px;
    }

    .message {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .cards {
      display: grid;
      gap: 14px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card-head {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfe;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      min-width: 0;
    }

    .tag {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 9px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .tag.answer {
      border-color: #b8d7c2;
      background: #eefaf1;
      color: var(--ok);
      font-weight: 800;
    }

    .tag.empty {
      border-color: #f1c6c1;
      background: #fff1f0;
      color: var(--bad);
      font-weight: 800;
    }

    .card-body {
      display: grid;
      gap: 12px;
      padding: 14px;
    }

    .field {
      display: grid;
      gap: 4px;
    }

    .label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .text {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .explanation {
      border-left: 4px solid var(--accent);
      background: #f8fbff;
      padding: 10px 12px;
    }

    .options {
      display: grid;
      gap: 8px;
    }

    .option {
      display: grid;
      grid-template-columns: 32px 1fr;
      gap: 8px;
      align-items: start;
    }

    .option-key {
      border-radius: 999px;
      background: #edf0f5;
      text-align: center;
      font-weight: 800;
      line-height: 32px;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    table {
      width: 100%;
      min-width: 980px;
      border-collapse: collapse;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 10px;
      text-align: left;
      vertical-align: top;
      overflow-wrap: anywhere;
    }

    th {
      position: sticky;
      top: 0;
      background: #f1f4f8;
      z-index: 1;
      font-size: 13px;
    }

    td.exp-col,
    td.q-col {
      min-width: 320px;
      white-space: pre-wrap;
    }

    @media (max-width: 760px) {
      .source-row,
      .controls {
        grid-template-columns: 1fr;
      }

      .top {
        padding: 14px 0;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap top">
      <h1>詳解閱讀器</h1>
      <div class="source-row">
        <input id="fileInput" type="file" accept=".xlsx,.xls,.csv,.tsv">
        <button class="primary" id="loadDefault" type="button">載入預設檔</button>
        <button id="cardMode" type="button" aria-pressed="true">卡片</button>
        <button id="tableMode" type="button" aria-pressed="false">表格</button>
      </div>
      <div class="controls">
        <input id="searchInput" type="text" placeholder="搜尋題號、題目、選項、詳解">
        <select id="sheetSelect" aria-label="工作表"></select>
        <select id="answerFilter" aria-label="答案">
          <option value="">全部答案</option>
          <option value="O">O</option>
          <option value="X">X</option>
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
          <option value="D">D</option>
          <option value="E">E</option>
        </select>
        <select id="expFilter" aria-label="詳解狀態">
          <option value="">全部詳解</option>
          <option value="has">有詳解</option>
          <option value="missing">缺詳解</option>
        </select>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="stats" id="stats"></div>
    <section id="content" class="message">請先載入 Excel，或按「載入預設檔」。</section>
  </main>

  <script>
    const DEFAULT_FILE = "../outputs/procurement-law/採購法_新增資料_五段式詳解版.xlsx";
    const OPTION_KEYS = ["A", "B", "C", "D", "E"];
    const state = {
      workbook: null,
      rowsBySheet: {},
      sheetName: "",
      view: "cards",
    };

    const els = {
      fileInput: document.getElementById("fileInput"),
      loadDefault: document.getElementById("loadDefault"),
      cardMode: document.getElementById("cardMode"),
      tableMode: document.getElementById("tableMode"),
      searchInput: document.getElementById("searchInput"),
      sheetSelect: document.getElementById("sheetSelect"),
      answerFilter: document.getElementById("answerFilter"),
      expFilter: document.getElementById("expFilter"),
      stats: document.getElementById("stats"),
      content: document.getElementById("content"),
    };

    function esc(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function firstValue(row, names) {
      for (const name of names) {
        if (row[name] !== undefined && String(row[name]).trim() !== "") return String(row[name]).trim();
      }
      return "";
    }

    function normalizeRow(row, index) {
      const normalized = {};
      for (const [key, value] of Object.entries(row)) {
        normalized[String(key).trim()] = value == null ? "" : String(value).trim();
      }
      return {
        raw: normalized,
        rowNumber: index + 2,
        id: firstValue(normalized, ["Id", "ID", "題號", "編號"]),
        type: firstValue(normalized, ["Type", "類型", "題型"]),
        level: firstValue(normalized, ["L1", "章節", "分類", "單元"]),
        answer: firstValue(normalized, ["Ans", "Answer", "答案"]),
        question: firstValue(normalized, ["Q", "Question", "題目"]),
        explanation: firstValue(normalized, ["Exp", "Explanation", "詳解", "解析"]),
        options: Object.fromEntries(OPTION_KEYS.map((key) => [key, firstValue(normalized, [key, `選項${key}`])])),
      };
    }

    function parseWorkbook(workbook) {
      state.workbook = workbook;
      state.rowsBySheet = {};
      for (const sheetName of workbook.SheetNames) {
        const worksheet = workbook.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(worksheet, { defval: "", raw: false });
        state.rowsBySheet[sheetName] = rows.map(normalizeRow).filter((row) => {
          return row.id || row.question || row.explanation || row.answer;
        });
      }
      state.sheetName = workbook.SheetNames[0] || "";
      renderSheetSelect();
      render();
    }

    function renderSheetSelect() {
      els.sheetSelect.innerHTML = state.workbook.SheetNames
        .map((name) => `<option value="${esc(name)}">${esc(name)}</option>`)
        .join("");
      els.sheetSelect.value = state.sheetName;
    }

    function filteredRows() {
      const rows = state.rowsBySheet[state.sheetName] || [];
      const query = els.searchInput.value.trim().toLowerCase();
      const answer = els.answerFilter.value;
      const exp = els.expFilter.value;
      return rows.filter((row) => {
        const haystack = [
          row.id,
          row.type,
          row.level,
          row.answer,
          row.question,
          row.explanation,
          ...Object.values(row.options),
        ].join("\n").toLowerCase();
        if (query && !haystack.includes(query)) return false;
        if (answer && row.answer !== answer) return false;
        if (exp === "has" && !row.explanation) return false;
        if (exp === "missing" && row.explanation) return false;
        return true;
      });
    }

    function renderStats(rows, total) {
      const missing = rows.filter((row) => !row.explanation).length;
      const sheetText = state.sheetName ? `工作表：${state.sheetName}` : "尚未載入";
      els.stats.innerHTML = [
        sheetText,
        `顯示：${rows.length} / ${total}`,
        `缺詳解：${missing}`,
      ].map((text) => `<span class="pill">${esc(text)}</span>`).join("");
    }

    function renderCards(rows) {
      if (!rows.length) {
        els.content.className = "message";
        els.content.textContent = "沒有符合條件的資料。";
        return;
      }
      els.content.className = "cards";
      els.content.innerHTML = rows.map((row) => {
        const optionHtml = OPTION_KEYS
          .filter((key) => row.options[key])
          .map((key) => `
            <div class="option">
              <div class="option-key">${key}</div>
              <div class="text">${esc(row.options[key])}</div>
            </div>
          `).join("");
        return `
          <article class="card">
            <div class="card-head">
              <div class="meta">
                <span class="tag">列 ${esc(row.rowNumber)}</span>
                ${row.id ? `<span class="tag">題號 ${esc(row.id)}</span>` : ""}
                ${row.type ? `<span class="tag">${esc(row.type)}</span>` : ""}
                ${row.level ? `<span class="tag">${esc(row.level)}</span>` : ""}
              </div>
              <span class="tag answer">答案 ${esc(row.answer || "-")}</span>
            </div>
            <div class="card-body">
              <div class="field">
                <div class="label">題目</div>
                <div class="text">${esc(row.question || "(空白)")}</div>
              </div>
              ${optionHtml ? `<div class="field"><div class="label">選項</div><div class="options">${optionHtml}</div></div>` : ""}
              <div class="field explanation">
                <div class="label">詳解</div>
                <div class="text">${esc(row.explanation || "缺詳解")}</div>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    function renderTable(rows) {
      els.content.className = "table-wrap";
      els.content.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>列</th><th>題號</th><th>類型</th><th>分類</th><th>答案</th>
              <th>題目</th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th><th>詳解</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map((row) => `
              <tr>
                <td>${esc(row.rowNumber)}</td>
                <td>${esc(row.id)}</td>
                <td>${esc(row.type)}</td>
                <td>${esc(row.level)}</td>
                <td>${esc(row.answer)}</td>
                <td class="q-col">${esc(row.question)}</td>
                ${OPTION_KEYS.map((key) => `<td>${esc(row.options[key])}</td>`).join("")}
                <td class="exp-col">${esc(row.explanation || "缺詳解")}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    function render() {
      if (!state.workbook) return;
      const total = (state.rowsBySheet[state.sheetName] || []).length;
      const rows = filteredRows();
      renderStats(rows, total);
      if (state.view === "table") renderTable(rows);
      else renderCards(rows);
    }

    async function loadDefaultWorkbook() {
      try {
        els.content.className = "message";
        els.content.textContent = "正在載入預設檔...";
        const response = await fetch(DEFAULT_FILE);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const buffer = await response.arrayBuffer();
        parseWorkbook(XLSX.read(buffer, { type: "array" }));
      } catch (error) {
        els.content.className = "message";
        els.content.textContent = "預設檔無法直接載入。請用上方按鈕選取 Excel 檔，或透過本機伺服器開啟這個頁面。";
      }
    }

    els.fileInput.addEventListener("change", async (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const buffer = await file.arrayBuffer();
      parseWorkbook(XLSX.read(buffer, { type: "array" }));
    });

    els.loadDefault.addEventListener("click", loadDefaultWorkbook);
    els.sheetSelect.addEventListener("change", () => {
      state.sheetName = els.sheetSelect.value;
      render();
    });
    els.searchInput.addEventListener("input", render);
    els.answerFilter.addEventListener("change", render);
    els.expFilter.addEventListener("change", render);
    els.cardMode.addEventListener("click", () => {
      state.view = "cards";
      els.cardMode.setAttribute("aria-pressed", "true");
      els.tableMode.setAttribute("aria-pressed", "false");
      render();
    });
    els.tableMode.addEventListener("click", () => {
      state.view = "table";
      els.cardMode.setAttribute("aria-pressed", "false");
      els.tableMode.setAttribute("aria-pressed", "true");
      render();
    });

    if (!window.XLSX) {
      els.content.textContent = "Excel 解析工具尚未載入。請確認此電腦可以連到網路，或稍後重新整理。";
    }
  </script>
</body>
</html>
